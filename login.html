<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — KanjiZen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zen: {
                            50: '#fcfbfa', 100: '#f5f2ec', 200: '#ebe5da', 300: '#d9cfbe',
                            400: '#b8a68c', 500: '#947e61', 600: '#7a6448', 700: '#5c4b35',
                            800: '#3d3122', 900: '#221b12', 950: '#140f09',
                        },
                        accent: { 500: '#d97706', 600: '#b45309' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jp: ['Noto Sans JP', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .zen-gradient { background: linear-gradient(135deg, #3d3122 0%, #5c4b35 100%); }
    </style>
</head>
<body class="h-full bg-zen-100/70 text-zen-800 dark:bg-zen-900 dark:text-zen-100 font-sans flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md">
        <!-- Шапка -->
        <div class="zen-gradient text-white rounded-t-3xl px-8 py-7 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex items-center space-x-4 relative z-10">
                <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/25 flex items-center justify-center font-black text-xl text-amber-100 font-jp">漢字</div>
                <div>
                    <h1 class="font-extrabold text-lg text-amber-50 leading-tight">KanjiZen</h1>
                    <p class="text-[11px] text-amber-100/70 font-medium">Вход в аккаунт</p>
                </div>
            </div>
        </div>

        <!-- Тело -->
        <div class="bg-white dark:bg-zen-800 border border-zen-200/80 dark:border-zen-700/60 rounded-b-3xl shadow-sm p-8 space-y-6">

            <!-- Форма входа -->
            <div id="login-box" class="space-y-4">
                <div>
                    <h2 class="text-xl font-bold text-zen-900 dark:text-amber-50">Войти или зарегистрироваться</h2>
                    <p class="text-sm text-zen-500 dark:text-zen-300 mt-1">Введите email, мы пришлём ссылку для входа. Пароль не нужен.</p>
                </div>
                <input id="email" type="email" placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-2xl bg-zen-50 dark:bg-zen-900/80 border border-zen-200 dark:border-zen-700 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-all">
                <button id="send-btn"
                    class="w-full py-3 rounded-2xl bg-amber-600 hover:bg-amber-700 text-white font-semibold shadow-sm shadow-amber-600/30 transition-all">
                    Получить ссылку для входа
                </button>
            </div>

            <!-- Вы вошли -->
            <div id="logged-box" class="hidden space-y-4 text-center">
                <div class="w-14 h-14 mx-auto rounded-full bg-amber-100 dark:bg-amber-950/80 flex items-center justify-center text-amber-700 dark:text-amber-300 text-2xl">✓</div>
                <div>
                    <h2 class="text-xl font-bold text-zen-900 dark:text-amber-50">Вы вошли</h2>
                    <p class="text-sm text-zen-500 dark:text-zen-300 mt-1">Аккаунт: <b id="user-email" class="text-zen-800 dark:text-zen-100"></b></p>
                </div>
                <div class="text-left bg-zen-50 dark:bg-zen-900/50 p-4 rounded-2xl border border-zen-200/70 dark:border-zen-700/60">
                    <span class="text-xs font-semibold text-zen-400 block mb-2 uppercase tracking-wider">Ваши уровни</span>
                    <div id="levels" class="text-sm text-zen-700 dark:text-zen-200">Загружаем...</div>
                </div>
                <button id="logout-btn"
                    class="w-full py-3 rounded-2xl bg-zen-100 hover:bg-zen-200 dark:bg-zen-700 dark:hover:bg-zen-600 font-semibold transition-all">
                    Выйти
                </button>
            </div>

            <p id="status" class="text-sm text-center text-zen-500 dark:text-zen-300 min-h-[1.25rem]"></p>
        </div>

        <p class="text-center text-xs text-zen-400 mt-6">
            <a href="/" class="hover:text-amber-600 transition-colors">← Вернуться к справочнику</a>
        </p>
    </div>

    <script>
        // Публичный ключ безопасно использовать на сайте: доступ к данным защищён правилами в базе.
        const SUPABASE_URL = 'https://stnxwbuozduhphftfqri.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sev2FLO_oLbIoLIWEwyXzw_l_N52RzS';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const statusEl = document.getElementById('status');

        async function loadLevels() {
            const { data, error } = await sb.from('purchases').select('level').order('level');
            const el = document.getElementById('levels');
            if (error) { el.innerText = 'Не удалось загрузить: ' + error.message; return; }
            el.innerText = data.length ? data.map(r => r.level).join(', ') : 'Пока нет открытых уровней';
        }

        function showState(session) {
            const logged = !!session;
            document.getElementById('login-box').classList.toggle('hidden', logged);
            document.getElementById('logged-box').classList.toggle('hidden', !logged);
            if (logged) {
                document.getElementById('user-email').innerText = session.user.email;
                loadLevels();
            }
        }

        document.getElementById('send-btn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) { statusEl.innerText = 'Введите email.'; return; }
            statusEl.innerText = 'Отправляем ссылку...';
            const { error } = await sb.auth.signInWithOtp({
                email,
                options: { emailRedirectTo: window.location.href.split('#')[0] }
            });
            statusEl.innerText = error
                ? 'Ошибка: ' + error.message
                : 'Ссылка отправлена на почту. Откройте письмо и перейдите по ссылке.';
        };

        document.getElementById('logout-btn').onclick = async () => {
            await sb.auth.signOut();
            showState(null);
            statusEl.innerText = 'Вы вышли из аккаунта.';
        };

        sb.auth.onAuthStateChange((event, session) => {
            showState(session);
            if (event === 'SIGNED_IN') statusEl.innerText = 'Вход выполнен.';
        });
    </script>
</body>
</html>
